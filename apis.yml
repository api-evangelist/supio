aid: supio
name: Supio
description: >-
  Supio is an agentic legal AI platform built for plaintiff and personal-injury
  law firms, supporting a case from intake to verdict. Its Supio Agent automates
  labor-intensive legal work — case intake, medical-record analysis and medical
  chronologies (MedChrons), demand-letter drafting, case-economics analysis, and
  litigation document drafting — and adds firm-level intelligence across cases.
  Supio publishes no public developer portal or OpenAPI, but offers a
  customer-available API for building custom integrations, dashboards, and
  workflows on the structured case data it generates, and integrates with case
  management systems (Litify, SmartAdvocate, CasePeer, MyCase, Smokeball),
  document stores (Box, Dropbox, OneDrive, SharePoint), and Westlaw via a Thomson
  Reuters partnership. The platform is SOC 2 Type II certified and HIPAA, PHIPA,
  and GDPR compliant.
